; Security hardening, loaded from conf.d after php.ini so these values win.

; Mitigates session.upload_progress session injection / fixation pre-auth RCE
; (https://github.com/ikow/php2shell-poc/blob/main/docs/ANALYSIS.md)
session.upload_progress.enabled = Off
session.use_only_cookies = On
session.use_strict_mode = On
